<body>
    <h1><span class="purpleyellow">Contact Me</span></h1>
   <br />
    <form id="contactinfo" onsubmit="return checkall">
<script>
function checkBox(id) {
    var box = document.getElementById(id);
    if (box.value.trim() == "") {
        box.style.backgroundColor = "red";
        return false;
    }
    else {
        box.style.backgroundColor = "white";
        return true;
    }
}
function showMessage(text) {
    var message = document.getElementById("message");
    message.innerHTML = text;
    message.style.color = "red";
    message.style.fontWeight = "bold";
}
function checkNames() {
    var first = checkBox("fName");
    var last = checkBox("lName");
    var email = checkBox("email");
    if (first == false || last == false || email == false) {
        showMessage("You haven't filled everything!");
        if (first == false) {
            document.getElementById("fName").focus();
        }
        return false;
    }
    return true;
}
function checkGame() {
    var game = checkBox("game");
    if (game == false) {
        showMessage("You haven't filled everything!");
        document.getElementById("game").focus();
        return false;
    }
    return true;
}
function checkEverything() {
    var names = checkNames();
    var game = checkGame();
    var burgers = document.querySelector(
        'input[name="burgers"]:checked'
    );
    if (names == false || game == false || burgers == null) {
        showMessage("You haven't filled out everything!");
        if (names == false) {
            if (document.getElementById("fName").value.trim() == "") {
                document.getElementById("fName").focus();
            }
        }
        return false;
    }
    alert("Form submitted successfully!");
    return false;
}
</script>
    First Name: <input type="text" id="fName"><br>
    Last Name: <input type="text" id="lName"><br>
    Email Address: <input type="text" id="email"><br>
    <button type="button" onclick="checkNames()" id="mySubmit">Submit</button>
